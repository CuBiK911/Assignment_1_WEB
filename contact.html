<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Art of Tiramisu</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">History & Recipe</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <p>Interested in learning how to make authentic tiramisu? Book a workshop or ask us a question!</p>
        
        <form action="#" method="POST">
            <fieldset>
                <legend>Personal Information</legend>
                
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="Maria Rossi">
                
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="maria@example.com">
                
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">
            </fieldset>

            <fieldset>
                <legend>Workshop Preferences</legend>
                
                <label for="date">Preferred Date:</label>
                <input type="date" id="date" name="date" min="2026-09-10">
                
                <label for="participants">Number of Participants:</label>
                <input type="number" id="participants" name="participants" min="1" max="12">
                
                <p>Skill Level:</p>
                <label><input type="radio" name="skill" value="beginner" required> Beginner </label>
                <label><input type="radio" name="skill" value="intermediate"> Intermediate </label>
                <label><input type="radio" name="skill" value="advanced"> Advanced </label>
                
                <label><input type="checkbox" name="newsletter" value="yes"> Subscribe to our dessert recipes newsletter</label>
                
                <label for="dietary">Dietary Restrictions:</label>
                <input type="text" id="dietary" name="dietary" placeholder="e.g., gluten-free">
                
                <label for="message">Additional Message:</label>
                <textarea id="message" name="message" rows="4" maxlength="500" placeholder="Tell us about your tiramisu interests..."></textarea>
            </fieldset>
            
            <button type="submit">Send Inquiry</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 The Art of Tiramisu. All rights reserved.</p>
    </footer>
</body>
</html>
